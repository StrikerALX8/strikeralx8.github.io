<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Noobini Brainrot Visualizer</title>
  <style>
    body {
      background-color: #0d1117;
      color: #e6edf3;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 40px;
    }
    h1 {
      color: #58a6ff;
      font-size: 2.5em;
      margin-bottom: 20px;
    }
    p {
      color: #8b949e;
      font-size: 1.1em;
      max-width: 700px;
      margin: 0 auto 30px auto;
    }
    select, button {
      background: #161b22;
      color: #e6edf3;
      border: 1px solid #30363d;
      padding: 10px 15px;
      border-radius: 6px;
      margin: 10px;
      font-size: 1em;
      cursor: pointer;
    }
    button:hover, select:hover {
      border-color: #58a6ff;
    }
    .preview {
      margin: 30px auto;
      width: 300px;
      height: 300px;
      background: #161b22;
      border: 2px solid #30363d;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .preview img {
      max-width: 100%;
      max-height: 100%;
      border-radius: 10px;
    }
    .info {
      font-size: 1.1em;
      margin-top: 15px;
      color: #8b949e;
    }
    .section {
      margin-top: 30px;
    }
  </style>
</head>
<body>
  <h1>Noobini Brainrot Visualizer</h1>
  <p class="info">
    Choose a mutation or trait to see how Noobini will look.
  </p>

  <div class="section">
    <label for="mutation">Mutation:</label>
    <select id="mutation">
      <option value="none">None</option>
      <option value="gold">Gold</option>
      <option value="diamond">Diamond</option>
      <option value="lava">Lava</option>
      <option value="rainbow">Rainbow</option>
      <option value="yingyang">Yin Yang</option>
    </select>
    <button onclick="updateMutation()">Show Mutation</button>
  </div>

  <div class="section">
    <label for="trait">Trait:</label>
    <select id="trait">
      <option value="none">None</option>
      <option value="taco">Taco</option>
    </select>
    <button onclick="updateTrait()">Show Trait</button>
  </div>

  <div class="preview" id="preview">
    <p>🧠 select a mutation or trait</p>
  </div>

  <p id="label" class="info"></p>

  <script>
    const base = "noobini_pizzanini";

    function updateMutation() {
      const mutation = document.getElementById("mutation").value;
      const preview = document.getElementById("preview");
      const label = document.getElementById("label");

      let filePath = mutation === "none" ? `images/${base}.png` : `images/${base}_${mutation}.png`;
      preview.innerHTML = `<img src="${filePath}" alt="${base} ${mutation}">`;
      label.textContent = `Noobini Pizzanini${mutation !== "none" ? " (" + mutation + ")" : ""}`;
    }

    function updateTrait() {
      const trait = document.getElementById("trait").value;
      const preview = document.getElementById("preview");
      const label = document.getElementById("label");

      let filePath = trait === "none" ? `images/${base}.png` : `images/${base}_${trait}.png`;
      preview.innerHTML = `<img src="${filePath}" alt="${base} ${trait}">`;
      label.textContent = `Noobini Pizzanini${trait !== "none" ? " (" + trait + ")" : ""}`;
    }
  </script>
</body>
</html>
