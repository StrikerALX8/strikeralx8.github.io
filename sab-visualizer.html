<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Steal a Brainrot Visualizer</title>
  <style>
    body {
      background-color: #0d1117;
      color: #e6edf3;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 40px;
    }
    h1 {
      color: #58a6ff;
      font-size: 2.5em;
      margin-bottom: 20px;
    }
    p {
      color: #8b949e;
      font-size: 1.1em;
      max-width: 700px;
      margin: 0 auto 30px auto;
    }
    select, button {
      background: #161b22;
      color: #e6edf3;
      border: 1px solid #30363d;
      padding: 10px 15px;
      border-radius: 6px;
      margin: 10px;
      font-size: 1em;
      cursor: pointer;
    }
    button:hover, select:hover {
      border-color: #58a6ff;
    }
    .preview {
      margin: 30px auto;
      width: 300px;
      height: 300px;
      background: #161b22;
      border: 2px solid #30363d;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .preview img {
      max-width: 100%;
      max-height: 100%;
      border-radius: 10px;
    }
    .info {
      font-size: 1.1em;
      margin-top: 15px;
      color: #8b949e;
    }
  </style>
</head>
<body>
  <h1>Steal a Brainrot Visualizer</h1>
  <p class="info">
    Choose your Brainrot and mutation to see how it will look.
  </p>

  <div>
    <label for="brainrot">Brainrot:</label>
    <select id="brainrot">
      <option value="noobini_pizzanini">Noobini Pizzanini</option>
      <option value="los_crocodillitos">Los Crocodillitos</option>
      <option value="squidward">Squidward</option>
      <option value="mr_clean">Mr Clean</option>
    </select>

    <label for="mutation">Mutation:</label>
    <select id="mutation">
      <option value="none">None</option>
      <option value="gold">Gold</option>
      <option value="diamond">Diamond</option>
      <option value="lava">Lava</option>
      <option value="rainbow">Rainbow</option>
    </select>

    <button onclick="updateImage()">Show Brainrot</button>
  </div>

  <div class="preview" id="preview">
    <p>🧠 select a brainrot</p>
  </div>

  <p id="label"></p>

  <script>
    function updateImage() {
      const brainrot = document.getElementById("brainrot").value;
      const mutation = document.getElementById("mutation").value;
      const preview = document.getElementById("preview");
      const label = document.getElementById("label");

      // image filename pattern: images/brainrot_mutation.png
      let filePath = `images/${brainrot}_${mutation}.png`;

      if (mutation === "none") {
        filePath = `images/${brainrot}.png`;
      }

      preview.innerHTML = `<img src="${filePath}" alt="${brainrot} ${mutation}">`;
      label.textContent = `${brainrot.replaceAll("_"," ")}${mutation !== "none" ? " ("+mutation+")" : ""}`;
    }
  </script>
</body>
</html>
